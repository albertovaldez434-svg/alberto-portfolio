<section id="logros" class="achievements" aria-labelledby="achievements-title">
  <header class="achievements-heading">
    <p class="section-label"><span aria-hidden="true">03</span> {{ copy.label }}</p>
    <h2 id="achievements-title">{{ copy.titleFirst }}<br /><span>{{ copy.titleSecond }}</span></h2>
    <p class="achievements-intro">{{ copy.intro }}</p>
  </header>

  <div class="achievement-grid">
    @for (achievement of achievements; track achievement.title) {
      <article class="achievement-card">
        <div class="achievement-topline">
          <span class="achievement-tag">{{ achievement.tag }}</span>
          <span class="achievement-number">{{ achievement.number }}</span>
        </div>
        <h3>{{ achievement.title }}</h3>
        <p>{{ achievement.description }}</p>
        <span class="achievement-decoration" aria-hidden="true"></span>
      </article>
    }
  </div>
</section>
