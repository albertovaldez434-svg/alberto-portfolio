<section id="contacto" class="contact" role="region" tabindex="-1" aria-labelledby="contact-title">
  <div class="contact-card">
    <div class="contact-copy">
      <p class="section-label"><span aria-hidden="true">04</span> {{ copy.label }}</p>
      <h2 id="contact-title">{{ copy.title }}</h2>
      <p class="contact-intro">{{ copy.intro }}</p>
    </div>

    <div class="contact-links" [attr.aria-label]="copy.methods">
      <a class="contact-link" href="mailto:albertovaldez434@gmail.com">
        <span class="contact-icon email-icon" aria-hidden="true">@</span>
        <span class="contact-detail">
          <span class="contact-label">{{ copy.email }}</span>
          <span class="contact-value">albertovaldez434@gmail.com</span>
        </span>
        <span class="contact-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        class="contact-link"
        href="https://wa.me/526441727482"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="contact-icon whatsapp-icon" aria-hidden="true">W</span>
        <span class="contact-detail">
          <span class="contact-label">{{ copy.whatsapp }}</span>
          <span class="contact-value">+52 6441 72 74 82</span>
        </span>
        <span class="contact-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        class="contact-link"
        href="https://www.linkedin.com/in/albertovaldez434"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="contact-icon linkedin-icon" aria-hidden="true">in</span>
        <span class="contact-detail">
          <span class="contact-label">{{ copy.linkedin }}</span>
          <span class="contact-value">linkedin.com/in/albertovaldez434</span>
        </span>
        <span class="contact-arrow" aria-hidden="true">↗</span>
      </a>
    </div>
  </div>

  <footer class="contact-footer">
    <span>{{ copy.footerRole }}</span>
    <a href="#inicio">{{ copy.backToTop }} <span aria-hidden="true">↑</span></a>
  </footer>
</section>
