<main class="portfolio">
  <section id="inicio" class="hero" aria-labelledby="hero-title">
    <div class="hero-card">
      <div class="hero-copy">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> {{ copy.available }}</p>
        <h1 id="hero-title">{{ copy.greeting }} <span>Alberto</span></h1>
        <p class="role">{{ copy.role }}</p>
        <p class="description">{{ copy.description }}</p>

        <nav class="actions" [attr.aria-label]="copy.actions">
          <app-custom-button href="/files/CV_Alberto_Valdez_Lopez_2026.pdf" variant="primary" download="cv-alberto.pdf">
            {{ copy.download }}
            <span aria-hidden="true">↓</span>
          </app-custom-button>
          <app-custom-button href="#experiencia" variant="secondary">
            {{ copy.experience }}
            <span aria-hidden="true">↘</span>
          </app-custom-button>
          <app-custom-button href="https://www.linkedin.com/in/albertovaldez434" variant="linkedin" target="_blank"
            rel="noopener noreferrer">
            LinkedIn
            <span aria-hidden="true">↗</span>
          </app-custom-button>
        </nav>
      </div>

      <div class="portrait" [attr.aria-label]="copy.portrait">
        <span class="portrait-orbit portrait-orbit-back" aria-hidden="true"></span>
        <span class="portrait-orbit portrait-orbit-front" aria-hidden="true"></span>
        <img ngSrc="/images/cartoon_avatar.png" width="360" height="400" priority
          [alt]="copy.portraitAlt" />
        <!-- <span class="portrait-caption">TU FOTO AQUÍ</span> -->
      </div>

      <span class="card-decoration" aria-hidden="true"></span>
    </div>
    <a class="scroll-cue" href="#experiencia">
      <span aria-hidden="true">↓</span>
      {{ copy.scroll }}
    </a>
  </section>
</main>
