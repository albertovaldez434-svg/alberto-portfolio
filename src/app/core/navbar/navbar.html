<header class="navbar">
  <a class="brand" href="#inicio" (click)="closeMenu()" [attr.aria-label]="homeAriaLabel">
    <span class="brand-mark" aria-hidden="true">A</span>
    <span>Alberto</span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="primary-navigation"
    [attr.aria-label]="menuOpen() ? closeMenuLabel : openMenuLabel"
    (click)="toggleMenu()"
  >
    <span class="menu-icon" [class.is-open]="menuOpen()" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <nav
    id="primary-navigation"
    class="navigation"
    [class.is-open]="menuOpen()"
    [attr.aria-label]="navigationAriaLabel"
    aria-describedby="keyboard-navigation-help"
  >
    <span id="keyboard-navigation-help" class="visually-hidden">
      {{ keyboardNavigationHelp }}
    </span>
    @for (item of navigationItems; track item.href) {
      <a
        class="navigation-link"
        [href]="item.href"
        (click)="closeMenu()"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <button
    class="language-toggle"
    type="button"
    [attr.aria-pressed]="selectedLanguage() === 'en'"
    [attr.aria-label]="
      languageSwitchLabel + '. ' + currentLanguageLabel + ': ' + languageNames[selectedLanguage()]
    "
    [attr.title]="languageSwitchLabel"
    (click)="toggleLanguage()"
  >
    <span [class.is-selected]="selectedLanguage() === 'es'">ES</span>
    <span class="language-divider" aria-hidden="true">/</span>
    <span [class.is-selected]="selectedLanguage() === 'en'">EN</span>
  </button>
</header>
