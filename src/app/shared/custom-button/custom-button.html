<a
  class="button"
  [class.button-primary]="variant() === 'primary'"
  [class.button-secondary]="variant() === 'secondary'"
  [class.button-linkedin]="variant() === 'linkedin'"
  [class.button-github]="variant() === 'github'"
  [href]="href()"
  [attr.download]="download() || null"
  [attr.target]="target() || null"
  [attr.rel]="rel() || null"
>
  <ng-content />
</a>
